# 容器内前端入口（容器化验收档）。
# 与 vite.config.ts 的开发代理保持同一套路径：前端始终请求 /api/**，
# 只是开发期由 Vite 转发到 localhost:8080，容器内由 nginx 转发到 api 服务名。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 关联 ID 与 trace 头原样透传，API 侧缺失时才生成，nginx 不得覆盖
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }

    # 单页应用：静态资源找不到时回落到 index.html，避免刷新后 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带 hash，可长缓存；index.html 必须每次校验
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
