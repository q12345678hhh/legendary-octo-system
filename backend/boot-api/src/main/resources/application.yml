spring:
  application:
    name: platform-api
  main:
    banner-mode: off

  datasource:
    # 运行期账号：无建表权限、NOBYPASSRLS，RLS 策略对它真实生效
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:dev_only_change_me_app}
    hikari:
      maximum-pool-size: ${PLATFORM_DB_POOL_SIZE:10}

  flyway:
    enabled: true
    # 迁移单独使用 owner 账号：建表、加策略、改类型都靠它，和运行期账号不得混用
    user: ${PLATFORM_DB_MIGRATION_USER:platform_owner}
    password: ${PLATFORM_DB_MIGRATION_PASSWORD:dev_only_change_me}
    locations: classpath:db/migration
    postgresql:
      # V3 的 CREATE INDEX CONCURRENTLY 必须在事务外执行。Flyway 默认把咨询锁放在一个
      # 未提交事务里，并发建索引会一直等这个事务（本地实测永久挂起），故关闭事务级锁。
      transactional-lock: false

  data:
    redis:
      host: ${PLATFORM_REDIS_HOST:localhost}
      port: ${PLATFORM_REDIS_PORT:6379}

  mvc:
    problemdetails:
      # 错误统一走 RFC 9457 Problem Details，前端与集成方不需要解析自定义错误结构
      enabled: true

server:
  port: 8080
  shutdown: graceful

platform:
  identity:
    # 会话绝对 8 小时、空闲 30 分钟；令牌明文只在创建响应出现一次，库里只存 SHA-256。
    session-absolute-ttl: ${PLATFORM_IDENTITY_SESSION_TTL:8h}
    session-idle-ttl: ${PLATFORM_IDENTITY_IDLE_TTL:30m}
    mfa-challenge-ttl: ${PLATFORM_IDENTITY_MFA_CHALLENGE_TTL:5m}
    invitation-ttl: ${PLATFORM_IDENTITY_INVITATION_TTL:72h}
    lock-duration: ${PLATFORM_IDENTITY_LOCK_DURATION:15m}
    max-failed-attempts: ${PLATFORM_IDENTITY_MAX_FAILED_ATTEMPTS:5}
    # 生产必须为 true；本地 http 联调可设 false，否则浏览器不会回传 Secure Cookie
    cookie-secure: ${PLATFORM_IDENTITY_COOKIE_SECURE:true}
    cookie-name: ${PLATFORM_IDENTITY_COOKIE:plt_session}
    csrf-cookie-name: ${PLATFORM_IDENTITY_CSRF_COOKIE:plt_csrf}
    # 32 字节 Base64 的 TOTP 密钥加密密钥；缺失时 MFA 端点返回 503，不会退化为明文存储
    mfa-key: ${PLATFORM_IDENTITY_MFA_KEY:}
  ops:
    # 平台运营端是独立认证域：会话 Cookie 只挂 Path=/platform，与租户 Cookie 物理分开
    session-absolute-ttl: ${PLATFORM_OPS_SESSION_TTL:8h}
    session-idle-ttl: ${PLATFORM_OPS_IDLE_TTL:30m}
    lock-duration: ${PLATFORM_OPS_LOCK_DURATION:15m}
    max-failed-attempts: ${PLATFORM_OPS_MAX_FAILED_ATTEMPTS:5}
    # 生产必须为 true；本地 http 联调可设 false，否则浏览器不会回传 Secure Cookie
    cookie-secure: ${PLATFORM_OPS_COOKIE_SECURE:true}
    cookie-name: ${PLATFORM_OPS_COOKIE:plt_ops_session}
    csrf-cookie-name: ${PLATFORM_OPS_CSRF_COOKIE:plt_ops_csrf}
    cookie-path: /platform
    # 首个运营账号引导：三项都提供且表为空时才创建，否则完全跳过
    bootstrap-email: ${PLATFORM_OPS_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${PLATFORM_OPS_BOOTSTRAP_PASSWORD:}
    bootstrap-role: ${PLATFORM_OPS_BOOTSTRAP_ROLE:platform-owner}
    bootstrap-display-name: ${PLATFORM_OPS_BOOTSTRAP_NAME:平台运营}
    metric-poll-interval: ${PLATFORM_OPS_METRIC_INTERVAL:15m}
    security-poll-interval: ${PLATFORM_OPS_SECURITY_INTERVAL:5m}
    abnormal-login-threshold: ${PLATFORM_OPS_ABNORMAL_LOGIN_THRESHOLD:10}
    abnormal-login-window-minutes: ${PLATFORM_OPS_ABNORMAL_LOGIN_WINDOW:15}
  storage:
    health-url: ${PLATFORM_STORAGE_HEALTH_URL:http://localhost:9000/minio/health/live}
    # 文件字节只走对象存储：API 只签发短 TTL 的预签名 URL，不转发内容
    endpoint: ${PLATFORM_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${PLATFORM_STORAGE_BUCKET:platform-dev}
    region: ${PLATFORM_STORAGE_REGION:us-east-1}
    # 不在源码里给默认密钥；缺失时预签名会明确报错，而不是悄悄用弱凭据
    access-key: ${PLATFORM_STORAGE_ACCESS_KEY:}
    secret-key: ${PLATFORM_STORAGE_SECRET_KEY:}
    upload-ttl: ${PLATFORM_STORAGE_UPLOAD_TTL:15m}
    download-ttl: ${PLATFORM_STORAGE_DOWNLOAD_TTL:5m}
  idempotency:
    # 幂等记录保留一天：足够覆盖客户端重试窗口，又不会长期占表
    ttl: ${PLATFORM_IDEMPOTENCY_TTL:24h}
  ai:
    report:
      # 未配置时周报直接降级为仅汇总时长，不阻塞员工提交
      base-url: ${PLATFORM_REPORT_AI_BASE_URL:}
      api-key: ${PLATFORM_REPORT_AI_API_KEY:}
      model: ${PLATFORM_REPORT_AI_MODEL:gpt-4o-mini}
      timeout: ${PLATFORM_REPORT_AI_TIMEOUT:20s}
      max-input-chars: ${PLATFORM_REPORT_AI_MAX_INPUT_CHARS:8000}
      prompt-version: ${PLATFORM_REPORT_AI_PROMPT_VERSION:wp04-02.v1}
  ocr:
    # 未配置时单据不做外部 OCR，直接转人工；任何失败都不会被当成自动通过
    base-url: ${PLATFORM_OCR_BASE_URL:}
    api-key: ${PLATFORM_OCR_API_KEY:}
    model: ${PLATFORM_OCR_MODEL:gpt-4o-mini}
    timeout: ${PLATFORM_OCR_TIMEOUT:10s}
    max-bytes: ${PLATFORM_OCR_MAX_BYTES:8388608}
    prompt-version: ${PLATFORM_OCR_PROMPT_VERSION:wp04-03.v1}
  smoke:
    # 冒烟端点只在本地验证「请求 → outbox → Worker」链路时打开
    enabled: ${PLATFORM_SMOKE_ENABLED:false}

logging:
  # 结构化日志：每行 JSON，MDC 里的 trace/correlation/tenant/subject 可直接被日志平台检索。
  # 业务正文（请求体、文件内容、工时原始记录）默认不进日志，只记录 ID 与状态。
  structured:
    format:
      console: ecs
  pattern:
    # 非结构化输出（例如本地临时切回 pattern）时仍带上关联 ID
    level: "%5p [trace=%X{trace_id:-} corr=%X{correlation_id:-} tenant=%X{tenant_id:-} subject=%X{subject_id:-}]"

management:
  endpoints:
    web:
      exposure:
        # metrics/prometheus 给仪表板与告警取数；不暴露 env、beans 等敏感端点
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 只暴露组件状态，不暴露细节：本地能看到 db/redis/storage 是否 UP，
      # 又不把连接串等内部信息写进响应。
      show-components: always
  info:
    env:
      enabled: false
