spring:
  application:
    name: platform-api
  main:
    banner-mode: off

  datasource:
    # 运行期账号：无建表权限、NOBYPASSRLS，RLS 策略对它真实生效
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:dev_only_change_me_app}
    hikari:
      maximum-pool-size: ${PLATFORM_DB_POOL_SIZE:10}

  flyway:
    enabled: true
    # 迁移单独使用 owner 账号：建表、加策略、改类型都靠它，和运行期账号不得混用
    user: ${PLATFORM_DB_MIGRATION_USER:platform_owner}
    password: ${PLATFORM_DB_MIGRATION_PASSWORD:dev_only_change_me}
    locations: classpath:db/migration
    postgresql:
      # V3 的 CREATE INDEX CONCURRENTLY 必须在事务外执行。Flyway 默认把咨询锁放在一个
      # 未提交事务里，并发建索引会一直等这个事务（本地实测永久挂起），故关闭事务级锁。
      transactional-lock: false

  data:
    redis:
      host: ${PLATFORM_REDIS_HOST:localhost}
      port: ${PLATFORM_REDIS_PORT:6379}

  mvc:
    problemdetails:
      # 错误统一走 RFC 9457 Problem Details，前端与集成方不需要解析自定义错误结构
      enabled: true

server:
  port: 8080
  shutdown: graceful

platform:
  storage:
    health-url: ${PLATFORM_STORAGE_HEALTH_URL:http://localhost:9000/minio/health/live}
    # 文件字节只走对象存储：API 只签发短 TTL 的预签名 URL，不转发内容
    endpoint: ${PLATFORM_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${PLATFORM_STORAGE_BUCKET:platform-dev}
    region: ${PLATFORM_STORAGE_REGION:us-east-1}
    # 不在源码里给默认密钥；缺失时预签名会明确报错，而不是悄悄用弱凭据
    access-key: ${PLATFORM_STORAGE_ACCESS_KEY:}
    secret-key: ${PLATFORM_STORAGE_SECRET_KEY:}
    upload-ttl: ${PLATFORM_STORAGE_UPLOAD_TTL:15m}
    download-ttl: ${PLATFORM_STORAGE_DOWNLOAD_TTL:5m}
  idempotency:
    # 幂等记录保留一天：足够覆盖客户端重试窗口，又不会长期占表
    ttl: ${PLATFORM_IDEMPOTENCY_TTL:24h}
  smoke:
    # 冒烟端点只在本地验证「请求 → outbox → Worker」链路时打开
    enabled: ${PLATFORM_SMOKE_ENABLED:false}
  work-assistant:
    # 策略与更新清单签名密钥只从环境变量注入；缺失时相关端点 503，绝不签发未签名策略。
    # WP01-05 本地脚本会临时生成一对 ECDSA P-256 密钥并通过环境变量传入。
    policy-private-key: ${PLATFORM_WA_POLICY_KEY:}
    policy-public-key-spki: ${PLATFORM_WA_POLICY_PUBLIC_KEY:}
    policy-key-id: ${PLATFORM_WA_POLICY_KEY_ID:local-policy-1}
    update-private-key: ${PLATFORM_WA_UPDATE_KEY:}
    update-public-key-spki: ${PLATFORM_WA_UPDATE_PUBLIC_KEY:}
    update-key-id: ${PLATFORM_WA_UPDATE_KEY_ID:local-update-1}
    clock-skew: ${PLATFORM_WA_CLOCK_SKEW:5m}
    min-supported-version: ${PLATFORM_WA_MIN_VERSION:0.1.0}
    update-version: ${PLATFORM_WA_UPDATE_VERSION:0.1.1}
    update-package-url: ${PLATFORM_WA_UPDATE_URL:}
    update-package-sha256: ${PLATFORM_WA_UPDATE_SHA256:}

logging:
  # 结构化日志：每行 JSON，MDC 里的 trace/correlation/tenant/subject 可直接被日志平台检索。
  # 业务正文（请求体、文件内容、工时原始记录）默认不进日志，只记录 ID 与状态。
  structured:
    format:
      console: ecs
  pattern:
    # 非结构化输出（例如本地临时切回 pattern）时仍带上关联 ID
    level: "%5p [trace=%X{trace_id:-} corr=%X{correlation_id:-} tenant=%X{tenant_id:-} subject=%X{subject_id:-}]"

management:
  endpoints:
    web:
      exposure:
        # metrics/prometheus 给仪表板与告警取数；不暴露 env、beans 等敏感端点
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 只暴露组件状态，不暴露细节：本地能看到 db/redis/storage 是否 UP，
      # 又不把连接串等内部信息写进响应。
      show-components: always
  info:
    env:
      enabled: false
